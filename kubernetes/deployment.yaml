apiVersion: apps/v1
kind: Deployment
metadata:
  name: sptc-application
  namespace: sptc-application
  labels:
    app: sptc-application
    app.kubernetes.io/name: sptc-application
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sptc-application
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sptc-application
        app.kubernetes.io/name: sptc-application
        app.kubernetes.io/version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: sptc-application
          image: {{IMAGE_URI}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: PORT
              value: "8080"
            - name: HEALTH_CHECK_PORT
              value: "8080"
            - name: MYSQL_HOST
              value: "{{MYSQL_HOST}}"
            - name: MYSQL_PORT
              value: "{{MYSQL_PORT}}"
            - name: MYSQL_DATABASE
              value: "{{MYSQL_DATABASE}}"
            - name: MYSQL_USERNAME
              value: "{{MYSQL_USERNAME}}"
            - name: MYSQL_PASSWORD
              value: "{{MYSQL_PASSWORD}}"
            - name: REDIS_CONNECTION_STRING
              value: "{{REDIS_CONNECTION_STRING}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: logs-volume
              mountPath: /app/logs
      volumes:
        - name: logs-volume
          emptyDir: {}
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
