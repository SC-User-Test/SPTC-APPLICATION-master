apiVersion: apps/v1
kind: Deployment
metadata:
  name: sptc-application
  namespace: sptc-application
  labels:
    app: sptc-application
    app.kubernetes.io/name: sptc-application
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sptc-application
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sptc-application
        app.kubernetes.io/name: sptc-application
        app.kubernetes.io/version: "1.0.0"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: sptc-application
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          env:
            # Health check port
            - name: HEALTH_CHECK_PORT
              value: "8080"

            # Application state base path
            - name: APPSTATE_BASE_PATH
              value: "/app/data"

            # .NET runtime settings
            - name: DOTNET_RUNNING_IN_CONTAINER
              value: "true"
            - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
              value: "false"

            # MySQL connection settings
            - name: MYSQL_HOST
              value: "{{MYSQL_HOST}}"
            - name: MYSQL_PORT
              value: "{{MYSQL_PORT}}"
            - name: MYSQL_DATABASE
              value: "{{MYSQL_DATABASE}}"
            - name: MYSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sptc-db-secret
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sptc-db-secret
                  key: password

            # Redis connection string (from Azure Key Vault via CSI Driver)
            - name: REDIS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: sptc-redis-secret
                  key: connection-string

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          volumeMounts:
            - name: sptc-data
              mountPath: /app/data
            - name: sptc-logs
              mountPath: /app/logs

      volumes:
        - name: sptc-data
          emptyDir: {}
        - name: sptc-logs
          emptyDir: {}

      securityContext:
        runAsNonRoot: false
        fsGroup: 1000
