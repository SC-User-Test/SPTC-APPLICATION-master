apiVersion: apps/v1
kind: Deployment
metadata:
  name: sptc-application
  namespace: sptc-application
  labels:
    app: sptc-application
    version: "1.0"
    managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sptc-application
  template:
    metadata:
      labels:
        app: sptc-application
        version: "1.0"
    spec:
      containers:
        - name: sptc-application
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # ASP.NET Core runtime settings
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: HEALTH_CHECK_PORT
              value: "8080"

            # MySQL connection — inject via Kubernetes Secret or AKS Key Vault CSI
            - name: MYSQL_HOST
              value: "{{MYSQL_HOST}}"
            - name: MYSQL_PORT
              value: "{{MYSQL_PORT}}"
            - name: MYSQL_DATABASE
              value: "{{MYSQL_DATABASE}}"
            - name: MYSQL_USERNAME
              value: "{{MYSQL_USERNAME}}"
            - name: MYSQL_PASSWORD
              value: "{{MYSQL_PASSWORD}}"

            # Redis distributed state — inject via Kubernetes Secret or AKS Key Vault CSI
            - name: REDIS_CONNECTION_STRING
              value: "{{REDIS_CONNECTION_STRING}}"

            # AppState persistent config directory
            - name: APPSTATE_DIR
              value: "/app/Config"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: config-volume
              mountPath: /app/Config
            - name: logs-volume
              mountPath: /app/logs

      volumes:
        - name: config-volume
          emptyDir: {}
        - name: logs-volume
          emptyDir: {}

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      restartPolicy: Always
